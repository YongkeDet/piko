name: Build custom download folder

on:
  workflow_dispatch:
  push:
    branches: [feat/custom-download-folder]
    paths-ignore:
      - .github/workflows/publish-custom-download-folder.yml
      - patches-bundle.json

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Test custom folder downloads
        run: ./gradlew -p tests/download-folder test
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          clean buildAndroid :patches:build
      - uses: actions/upload-artifact@v7
        with:
          name: piko-custom-download-folder
          path: patches/build/libs/*.mpp
          if-no-files-found: error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: download-folder-tests
          path: tests/download-folder/build/reports/tests/test
