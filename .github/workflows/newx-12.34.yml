name: Build NewX 12.34

on:
  workflow_dispatch:
  push:
    branches: [feat/x-12.34-full]
    paths-ignore:
      - patches-bundle.json
      - docs/**
      - .github/workflows/publish-custom-download-folder.yml

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build NewX
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          clean :extensions:newx:test buildAndroid :patches:build
          :patches:lintNewxResolvers :patches:checkExtensionDescriptors
      - name: Record bundle provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          version = re.search(r'^version\s*=\s*(.+)$', pathlib.Path('gradle.properties').read_text(), re.M).group(1).strip()
          bundle = pathlib.Path('patches/build/libs') / f'patches-{version}.mpp'
          with zipfile.ZipFile(bundle) as archive:
              assert 'classes.dex' in archive.namelist(), 'Manager requires the Android DEX patch bundle'
              assert not any(n.startswith(('app/crimera/patches/twitter/', 'app/crimera/patches/instagram/', 'app/revanced/patches/')) for n in archive.namelist())
          provenance = {'source_sha': os.environ['GITHUB_SHA'], 'bundle': bundle.name,
                        'sha256': hashlib.sha256(bundle.read_bytes()).hexdigest()}
          bundle.with_name('source-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: piko-newx-12.34
          path: |
            patches/build/libs/*.mpp
            !patches/build/libs/*-sources.mpp
            !patches/build/libs/*-javadoc.mpp
            patches/build/libs/source-provenance.json
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newx-tests
          path: |
            patches/build/reports/
            extensions/newx/build/reports/tests/
