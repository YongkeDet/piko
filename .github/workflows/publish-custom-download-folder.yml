name: Publish verified NewX 12.34 bundle

on:
  workflow_dispatch:
  push:
    branches: [feat/x-12.34-full]
    paths:
      - .github/workflows/publish-custom-download-folder.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-newx-custom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: '38783573757'
      SOURCE_SHA: 9eb09ff4c5df3abb86693d4faa5532020242c78f
      BUNDLE_SHA256: 31b9adbee0e2ab1a5200f15413eb3635233427ba719b99e7f94f2d1e93eebe9a
      RELEASE_TAG: v3.10.0-custom-newx.4
      BUNDLE_NAME: patches-3.10.0-custom-newx.4.mpp
    steps:
      - uses: actions/checkout@v7
      - name: Verify source build
        run: |
          test "$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')" = "$SOURCE_SHA"
          test "$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = success
      - name: Download the verified build
        run: >-
          gh run download "$SOURCE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name piko-newx-12.34
          --dir dist
      - name: Verify bundle and provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          bundle = root / os.environ['BUNDLE_NAME']
          record = json.loads((root / 'source-provenance.json').read_text())
          assert record['source_sha'] == os.environ['SOURCE_SHA']
          assert record['bundle'] == bundle.name
          digest = hashlib.sha256(bundle.read_bytes()).hexdigest()
          assert record['sha256'] == digest == os.environ['BUNDLE_SHA256']
          (root / 'SHA256SUMS').write_text(f'{digest}  {bundle.name}\n')
          PY
      - name: Publish bundle
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/$BUNDLE_NAME" dist/SHA256SUMS dist/source-provenance.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Piko NewX Custom — 去掉下载成功的底部重复提示' \
            --notes-file docs/releases/v3.10.0-custom-newx.4.md \
            --latest
