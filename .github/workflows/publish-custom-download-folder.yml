name: Publish custom download folder

on:
  workflow_dispatch:
  push:
    branches: [feat/custom-download-folder]
    paths:
      - .github/workflows/publish-custom-download-folder.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-custom-download-folder
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: '38681543014'
      SOURCE_SHA: dbb5a6dd23886423b18fff832c5a8ebfdba0a48f
      BUNDLE_SHA256: bc45e94eca4d845a535c33238a8cc3d6a14c4c2ff27789dd59bd0cd106878a78
      RELEASE_TAG: v3.10.0-custom-download.1
    steps:
      - name: Download the verified build
        run: >-
          gh run download "$SOURCE_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name piko-custom-download-folder
          --dir dist
      - name: Verify bundle checksum
        working-directory: dist
        run: |
          printf '%s  %s\n' "$BUNDLE_SHA256" 'patches-3.10.0.mpp' > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish bundle
        run: |
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          Adds a system folder picker for custom X/Twitter photo and video download destinations.
          Open Piko settings > Downloads > Choose custom download folder after patching X.

          Built from dbb5a6dd23886423b18fff832c5a8ebfdba0a48f.
          Validation: 11 download-folder tests and the full Android/patch bundle build passed in run 38681543014.
          Device testing is still pending.
          NOTES
          gh release create "$RELEASE_TAG" \
            dist/patches-3.10.0.mpp dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Piko 3.10.0 - Custom download folder' \
            --notes-file dist/RELEASE_NOTES.md \
            --latest
